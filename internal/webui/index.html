<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声轨通无障碍字幕质检台</title><link rel="stylesheet" href="/assets/style.css"></head><body><main><header><h1>声轨通无障碍字幕质检台</h1><p>字幕母版从创建到交付的状态工作台</p></header><nav class="tabs"><button id="packagesTab" class="active">字幕包</button><button id="qualityTab">质检统计</button></nav><section id="app"><div id="packageView"><div class="toolbar"><button id="new">新建字幕包</button><button id="refresh">刷新</button><select id="status"><option value="">全部状态</option><option value="draft">草稿</option><option value="prepared">已准备</option><option value="reviewing">审校中</option><option value="correction_required">需要修订</option><option value="review_passed">复审通过</option><option value="frozen">已冻结</option><option value="delivered">已交付</option></select><input id="search" placeholder="节目标题或期号"><button id="clear">清空筛选</button></div><div id="ruleFilter"></div><div id="stats"></div><div id="packages"></div><div id="detail"></div></div><div id="qualityView" hidden><div class="panel"><div class="toolbar"><label>开始日期 <input id="statsFrom" type="date"></label><label>结束日期 <input id="statsTo" type="date"></label><input id="statsLanguage" placeholder="语言，例如 zh-CN"><input id="statsStandard" placeholder="交付标准"><button id="statsLoad">刷新统计</button></div><div id="qualityResults"></div></div></div></section></main><script src="/assets/app.js"></script></body></html>
